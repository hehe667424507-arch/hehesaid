<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#1f5f9e" />
    <meta name="description" content="纯本地的图片刷题工具：存题目图、随机抽题、记录对错。" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="图片刷题" />
    <title>图片刷题</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="vendor/cropper.min.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="boot-veil">
      <p class="boot-title" id="boot-title">正在启动…</p>
      <p class="boot-sub" id="boot-sub">第一次打开会慢一点，稍等几秒。</p>
      <button class="boot-rescue" id="boot-rescue" type="button" hidden>
        清掉网页缓存并重启
      </button>
      <p class="boot-tip" id="boot-tip" hidden>
        这个操作只会清掉网页文件缓存，不会删掉你的题库。
      </p>
    </div>

    <div id="file-warning" hidden>
      <h1>请双击「启动.bat」来打开</h1>
      <p>
        这个应用需要本地小服务器才能保存图片。直接双击 index.html 打开会白屏，这是浏览器的安全限制。
      </p>
      <p>正确做法：回到文件夹，双击 <b>启动.bat</b>，等浏览器自动打开即可。</p>
    </div>

    <div id="app">
      <header id="topbar">
        <div class="topbar-row">
          <select id="categorySelect" class="pick" aria-label="大类目"></select>
          <select id="subcategorySelect" class="pick" aria-label="小类目"></select>
          <button id="btnAddCategory" class="btn btn-sm btn-icon" type="button" title="新建大类目">
            ＋
          </button>
        </div>
        <div id="stats" class="stats"></div>
      </header>

      <main id="main">
        <section id="view-quiz" class="view" hidden></section>
        <section id="view-ingest" class="view" hidden></section>
        <section id="view-lists" class="view" hidden></section>
        <section id="view-settings" class="view" hidden></section>
      </main>

      <nav id="tabbar" aria-label="主导航">
        <button class="tab active" type="button" data-tab="quiz">刷题</button>
        <button class="tab" type="button" data-tab="ingest">录入</button>
        <button class="tab" type="button" data-tab="lists">题库</button>
        <button class="tab" type="button" data-tab="settings">设置</button>
      </nav>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <noscript>这个应用需要开启 JavaScript 才能使用。</noscript>

    <script>
      if (location.protocol === 'file:') {
        document.getElementById('file-warning').hidden = false
        document.getElementById('app').hidden = true
        document.getElementById('boot-veil').remove()
      }

      // 启动看门狗：不依赖任何模块脚本，JS 加载失败时也能用。
      // 8 秒还没启动完，就把卡在哪一步、报了什么错显示出来。
      window.__bootStage = '加载脚本'
      window.__bootErrors = []

      window.addEventListener('error', function (event) {
        var msg = event.message || '未知错误'
        if (event.filename) {
          msg += '（' + String(event.filename).split('/').pop() + ':' + (event.lineno || 0) + '）'
        }
        window.__bootErrors.push(msg)
      })

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason
        window.__bootErrors.push(
          'Promise: ' + (reason && reason.message ? reason.message : String(reason)),
        )
      })

      window.__bootWatch = setTimeout(async function () {
        var veil = document.getElementById('boot-veil')
        if (!veil) return

        document.getElementById('boot-title').textContent = '启动卡住了'
        var lines = []
        lines.push('卡在：' + (window.__bootStage || '未知'))

        var ua = navigator.userAgent || ''
        var ver = ua.match(/EdgA?\/([\d.]+)/) || ua.match(/Chrome\/([\d.]+)/)
        lines.push('浏览器：' + (ver ? '内核 ' + ver[1] : ua.slice(0, 40)))

        if (window.__bootErrors.length) {
          lines.push('错误：' + window.__bootErrors.slice(0, 2).join('；'))
        }

        // 探一下模块本身能不能加载：能加载说明是执行时卡住，加载不了说明文件/语法有问题。
        try {
          await import('./js/main.js?probe=' + Date.now())
          lines.push('脚本：能加载（说明是运行中卡住）')
        } catch (error) {
          lines.push('脚本加载失败：' + (error && error.message ? error.message : String(error)))
        }

        document.getElementById('boot-sub').textContent = lines.join('\n')
        document.getElementById('boot-rescue').hidden = false
        document.getElementById('boot-tip').hidden = false
      }, 8000)

      window.__rescueBoot = async function () {
        var button = document.getElementById('boot-rescue')
        button.disabled = true
        button.textContent = '正在清理…'
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations()
            for (var i = 0; i < regs.length; i += 1) await regs[i].unregister()
          }
        } catch (error) {}
        try {
          if ('caches' in window) {
            var keys = await caches.keys()
            for (var j = 0; j < keys.length; j += 1) await caches.delete(keys[j])
          }
        } catch (error) {}
        location.reload()
      }

      document.getElementById('boot-rescue').onclick = function () {
        window.__rescueBoot()
      }
    </script>
    <script src="vendor/jszip.min.js"></script>
    <script src="vendor/cropper.min.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
